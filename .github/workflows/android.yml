name: Android CI Build (Release)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Preparar el Keystore desde Secretos
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-release-key.keystore
          # Si el usuario no configuró el secreto KEYSTORE_BASE64, caerá en modo "debug fijo" 
          # gracias a la validación en build.gradle.kts.

      - name: Compilar APK (Release)
        env:
          KEYSTORE_FILE_PATH: ../my-release-key.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Solo usar las variables de entorno si existe el archivo keystore generado
          if [ -s my-release-key.keystore ]; then
             echo "Keystore configurado por secretos. Usando credenciales de producción."
             gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          else
             echo "Advertencia: Secretos no definidos o vacíos. Generando release usando debug keystore fijo para evitar conflictos."
             unset KEYSTORE_FILE_PATH
             gradle assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          fi

      - name: Subir APK de Release como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # (Opcional) Publica/actualiza un Release en GitHub para actualizaciones automáticas OTA
      - name: Preparar archivo de versión
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: echo "${{ github.run_number }}" > version.txt

      - name: Eliminar el Release 'latest-release' anterior (si existe)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: gh release delete latest-release --yes --cleanup-tag || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar el nuevo Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          gh release create latest-release \
            app/build/outputs/apk/release/app-release.apk \
            version.txt \
            --title "JetGo Release (build ${{ github.run_number }})" \
            --notes "Compilación automática de producción (commit ${{ github.sha }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
