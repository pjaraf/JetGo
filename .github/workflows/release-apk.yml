name: Build & Release APK (signed)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceptar todas las licencias del SDK de Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Verificar si hay secretos de firma configurados
        id: check_secrets
        run: echo "has_keystore=${{ secrets.KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Decodificar el keystore desde el secreto
        if: steps.check_secrets.outputs.has_keystore == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
          cat > keystore.properties << EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Compilar APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Advertencia si no se firmó
        if: steps.check_secrets.outputs.has_keystore != 'true'
        run: |
          echo "::warning::No se configuraron los secretos de firma. El APK generado NO está firmado."

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: JetGo-release
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Publicar como GitHub Release
        if: steps.check_secrets.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
