name: Build & Release APK (signed)

# Se dispara al subir una etiqueta de versión, ej: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Garantizar Keystore Fijo
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore || true

      - name: Compilar APK release
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Subir el APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: JetGo-release
          path: app/build/outputs/apk/release/app-release*.apk
          if-no-files-found: error

      - name: Publicar como GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
